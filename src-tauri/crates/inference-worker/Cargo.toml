[package]
name = "knovum-inference-worker"
version = "0.1.0"
publish = false
license-file.workspace = true
edition = "2021"
rust-version = "1.94"

[dependencies]
knovum-inference-libraries = { path = "../inference-libraries" }
knovum-inference-contracts = { path = "../inference-contracts" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.11.0"
hex = "0.4.3"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-21"] }
memory-stats = "=1.2.0"
walkdir = "=2.5.0"
hound = "=3.5.1"
sentencepiece = { version = "=0.14.0", features = ["static"] }
rubato = "=5.0.1"
audioadapter-buffers = "=5.1.0"
rand = "=0.9.5"
rand_pcg = "=0.9.0"
uuid = { version = "1.19", features = ["v4"] }
libloading = "=0.8.9"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-version = "=0.1.7"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
candle-core = { version = "=0.11.0", features = ["metal"] }
candle-nn = { version = "=0.11.0", features = ["metal"] }
candle-transformers = { version = "=0.11.0", features = ["metal"] }

[build-dependencies]
bindgen = "=0.72.1"
