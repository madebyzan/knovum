[package]
name = "knovum"
publish = false
default-run = "knovum"
version = "0.0.1"
description = "Local-first desktop knowledge space"
authors = ["Zan"]
edition = "2021"
rust-version = "1.94"

[lib]
name = "knovum_lib"
crate-type = ["rlib"]

[build-dependencies]
serde_json = "1.0.151"
tauri-build = { version = "2.7.1", features = [] }

[features]
default = []
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2.12.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-clipboard = "2.1.11"
clipboard-rs = "0.3.5"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-log = "2.10.0"
tauri-plugin-updater = "2.13.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-store = "2.5.0"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
log = "0.4.34"
base64 = "0.23.1"
ring = "0.17.14"
infer = "0.22.0"
mime = "0.3.17"
mime_guess = { version = "2.0.5", features = ["rev-mappings"] }
hound = "3.5.1"
tauri-plugin-wdio = { version = "1.4.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.4.0", optional = true }

image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls",
  "json",
  "query",
  "blocking",
  "multipart",
  "stream",
] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tar = "0.4.46"
flate2 = "1.1.10"
encoding_rs = "0.8.42"
genai = "=0.6.5"
docx-rs = { version = "=0.4.22", default-features = false, features = ["image"] }
pulldown-cmark = "=0.13.4"
typst-as-lib = { version = "=0.16.0", default-features = false, features = ["typst-kit-fonts"] }
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
fontdb = "=0.24.0"
futures = "0.3.34"
office_oxide = { version = "=0.1.13", default-features = false }
pdf-inspector = { version = "=1.25.2", default-features = false }

serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = [
  "json",
  "macros",
  "migrate",
  "sqlite",
  "runtime-tokio",
] }
sha2 = "=0.11.0"
hex = "0.4.3"
tokio = { version = "1.53.2", features = ["process", "io-util", "fs", "sync", "time", "rt", "macros", "net"] }
uuid = { version = "1.27.0", features = ["v4"] }
fnv = "1.0.7"
lancedb = "=0.37.1"
arrow-array = "58.4.0"
arrow-schema = "58.4.0"

# Spaces knowledge server
rmcp = { version = "=3.5.1", features = [
  "client",
  "auth",
  "elicitation",
  "reqwest",
  "transport-streamable-http-server",
  "transport-streamable-http-client-reqwest",
] }
async-trait = "=0.1.92"
oauth2 = "=5.0.0"
sse-stream = "=0.2.6"
yaml-rust2 = "=0.13.0"
iri-string = "=0.7.14"
unicode-normalization = "=0.1.25"
gix = { version = "=0.88.0", default-features = false, features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
  "sha1",
] }
url = "=2.5.8"
axum = "=0.8.9"
tokio-util = { version = "=0.7.19", features = ["codec"] }
walkdir = "2.5.0"
agent-client-protocol = { version = "=3.0.0", features = ["process"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
schemars = "=1.2.2"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings", "serde-compat", "serde-json-impl"] }
jsonschema = { version = "=0.58.6", default-features = false }

# Quick Look: document thumbnails for imported files, and the system preview panel. The objc2
# framework crates default to every class they bind, which would pull UIKit and AppKit image
# bindings into a macOS-only thumbnail path, so the ones Knovum adds enable only the classes it names.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
  "std",
  "CGBitmapContext",
  "CGColorSpace",
  "CGContext",
  "CGImage",
  "CGPDFDocument",
  "CGPDFPage",
  "CGAffineTransform",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
  "CFString",
  "CFURL",
  "objc2",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSError",
  "NSString",
  "NSURL",
  "NSProcessInfo",
] }
objc2-image-io = { version = "0.3.2", default-features = false, features = [
  "std",
  "CGImageDestination",
  "objc2",
  "objc2-core-graphics",
] }
objc2-quick-look-thumbnailing = { version = "0.3.2", default-features = false, features = [
  "std",
  "QLThumbnailGenerationRequest",
  "QLThumbnailGenerator",
  "QLThumbnailRepresentation",
  "block2",
  "objc2-core-foundation",
  "objc2-core-graphics",
] }
quicklook = "0.2.2"

# Windows Shell owns document thumbnails. Full preview remains behind the same system-preview
# boundary, but needs its own HWND/STA host before it can be enabled.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Data_Pdf",
  "Foundation",
  "Storage",
  "Storage_Streams",
  "Graphics_Imaging",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")))'.dependencies]
core-graphics = "0.25.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "libc",
  "NSRunningApplication",
  "NSWorkspace",
] }

[target.'cfg(any(all(target_os = "macos", any(target_arch = "aarch64", target_arch = "x86_64")), all(target_os = "windows", target_arch = "x86_64")))'.dependencies]
cpal = "0.18.2"
tauri-plugin-global-shortcut = "=2.4.0"

[profile.dev]
opt-level = 0
incremental = true
# Keep useful application backtraces without retaining full debug object files.
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = 0

[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = 2

[profile.debugging.package."*"]
debug = 2

[lints.rust]
linker_messages = "allow"

# Upstream security fix; remove after a compatible crates.io release includes it.
# https://github.com/typst/citationberg/pull/44
[patch.crates-io]
citationberg = { git = "https://github.com/typst/citationberg", rev = "06a591e2f237d25e1dfdedac3f3d1494c496c52d" }
