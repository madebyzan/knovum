name: Bug Report
description: Create a report to help us improve Knovum
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please check if a similar issue already exists before submitting.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you running Knovum on?
      options:
        - macOS (Apple Silicon - M-series)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other (specify in description)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: Which version of Knovum are you using? (e.g. v0.0.1)
      placeholder: "v0.0.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open space '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and Screenshots
      description: If applicable, add error logs or screenshots to help explain the problem.
      render: shell
