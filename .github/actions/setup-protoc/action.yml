name: Setup Protobuf compiler
description: Install the reviewed host compiler required by Lance build scripts.

runs:
  using: composite
  steps:
    - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
      with:
        version: "32.1"
        repo-token: ${{ github.token }}
    - name: Verify compiler version
      shell: bash
      run: test "$(protoc --version)" = "libprotoc 32.1"
