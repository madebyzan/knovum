name: Updater review evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    if: github.head_ref == 'feat/signed-application-updates'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive reviewed source
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/updater-review"
          git rev-parse HEAD > "$RUNNER_TEMP/updater-review/commit.txt"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/updater-review/source.tar.gz"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install repository tooling
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Record actual formatter output
        run: |
          pnpm exec oxfmt .
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --binary > "$RUNNER_TEMP/updater-review/format.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-review-evidence
          path: ${{ runner.temp }}/updater-review
          retention-days: 2
          if-no-files-found: error

  native-updater:
    if: github.head_ref == 'feat/signed-application-updates'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Compile the actual updater modules against locked direct dependencies
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { copyFileSync, mkdirSync, readFileSync, writeFileSync } from "node:fs";
          import { join, resolve } from "node:path";
          const root = join(process.env.RUNNER_TEMP, "updater-native-review");
          mkdirSync(root);
          const packages = readFileSync("src-tauri/Cargo.lock", "utf8").split("[[package]]");
          const dependencies = {
            tauri: [], "tauri-plugin-updater": [],
            tokio: ["rt", "macros", "time", "sync"], "tokio-util": [],
            serde: ["derive"], serde_json: [], "ts-rs": ["no-serde-warnings", "serde-compat"], log: [],
          };
          let manifest = '[package]\nname = "knovum-updater-review"\nversion = "0.0.0"\nedition = "2021"\n[lib]\npath = "lib.rs"\n[dependencies]\n';
          for (const [name, features] of Object.entries(dependencies)) {
            const item = packages.find((item) => item.includes(`name = "${name}"\n`));
            const version = /version = "([^"]+)"/.exec(item)[1];
            manifest += `${name} = { version = "=${version}", features = ${JSON.stringify(features)} }\n`;
          }
          manifest += '[profile.dev]\ndebug = 0\n[profile.test]\ndebug = 0\n';
          writeFileSync(join(root, "Cargo.toml"), manifest);
          copyFileSync("src-tauri/Cargo.lock", join(root, "Cargo.lock"));
          writeFileSync(join(root, "lib.rs"), ["app_error", "updater"].map((name) =>
            `#[path = ${JSON.stringify(resolve(`src-tauri/src/${name}/mod.rs`))}] pub mod ${name};`
          ).join("\n"));
          JS
          cargo test --manifest-path "$RUNNER_TEMP/updater-native-review/Cargo.toml" updater:: -- --nocapture
