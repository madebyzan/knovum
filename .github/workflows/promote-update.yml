name: Promote verified update

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing signed candidate version (major.minor.patch)
        type: string
        required: true
      upgrade_evidence_url:
        description: HTTPS link to approved platform installation and N-to-N+1 upgrade evidence
        type: string
        required: true
      artifact_base_url:
        description: Optional permanent public HTTPS directory containing unchanged signed artifacts (for COS/CDN migration)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: knovum-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release-publish
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Verify and atomically promote the stable channel
        env:
          GH_TOKEN: ${{ secrets.KNOVUM_DISTRIBUTION_TOKEN }}
          KNOVUM_DISTRIBUTION_REPOSITORY: ${{ vars.KNOVUM_DISTRIBUTION_REPOSITORY }}
          KNOVUM_UPDATER_ENDPOINT: ${{ vars.KNOVUM_UPDATER_ENDPOINT }}
          KNOVUM_UPDATER_PUBKEY: ${{ vars.KNOVUM_UPDATER_PUBKEY }}
          RELEASE_VERSION: ${{ inputs.version }}
          UPGRADE_EVIDENCE_URL: ${{ inputs.upgrade_evidence_url }}
          ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
        run: node tools/promote-update.mjs
