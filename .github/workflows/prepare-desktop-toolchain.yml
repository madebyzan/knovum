name: Prepare matching desktop toolchain

on:
  push:
    branches: [feat/signed-application-updates]
    paths: [.github/workflows/prepare-desktop-toolchain.yml]

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'madebyzan/knovum'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Resolve the matching released API and CLI
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          if (manifest.dependencies['@tauri-apps/api'] !== '^2.11.1' || manifest.devDependencies['@tauri-apps/cli'] !== '^2.11.4') {
            throw new Error('The reviewed Tauri frontend baseline has changed.');
          }
          manifest.dependencies['@tauri-apps/api'] = '^2.12.1';
          manifest.devDependencies['@tauri-apps/cli'] = '^2.12.1';
          writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');
          JS
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile
          pnpm exec tauri --version
          cargo fmt --manifest-path src-tauri/Cargo.toml
          git diff --check
          git diff --stat
          git diff -- src-tauri/src
      - name: Verify all frontend and release-tool tests
        run: |
          node --test tools/__tests__/*.test.mjs
          pnpm check:web
      - name: Audit production frontend dependencies
        run: pnpm security:web
      - name: Store candidate inputs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, subprocess
          from pathlib import Path
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          expected = {'package.json', 'pnpm-lock.yaml', 'src-tauri/src/external_agents/discovery.rs', 'src-tauri/src/file_inspection/mod.rs', 'src-tauri/src/spaces/previews/thumbnail.rs', 'src-tauri/src/system_font.rs'}
          assert set(changed).issubset(expected), changed
          for name in changed:
              data = {'encoding': 'base64', 'content': base64.b64encode(Path(name).read_bytes()).decode()}
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/madebyzan/knovum/git/blobs', '--input', '-'], input=json.dumps(data), text=True, capture_output=True, check=True)
              print('CANDIDATE_BLOB', name, json.loads(result.stdout)['sha'], flush=True)
          PY
