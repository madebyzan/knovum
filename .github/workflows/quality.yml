name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Check Python worker
        run: npm run check:python

  web:
    name: Web and source quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          check-latest: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run web gates
        run: pnpm check:web

  # A broken workflow is otherwise reported by a failed run, which on this repository costs hours
  # of desktop runners. Expressions, inputs, runner labels and action schemas are static.
  workflows:
    name: Workflow definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflow definitions
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # A shipped migration is a checksum recorded in databases people already have. Editing one makes
  # their library refuse to open, so the history is append-only: a schema change is the next
  # numbered file (docs/data-ownership.md §Migration policy).
  migrations:
    name: Shipped migrations are immutable
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject changes to migrations that already exist on the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Compare against the fork point, not the base tip: a branch that simply has not caught up
          # with a new migration on main is behind, not guilty.
          fork_point=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          changed=$(git diff --name-only --diff-filter=MDR "$fork_point" "$HEAD_SHA" -- 'src-tauri/src/**/migrations/*.sql')
          if [ -n "$changed" ]; then
            echo "These already-shipped migrations were modified, deleted or renamed:"
            echo "$changed"
            echo "Add the next numbered migration instead; a released schema is frozen."
            exit 1
          fi

  # Licenses are a property of the locked graph, so they gate every change. Advisories are not:
  # they change without the repository changing and are audited by security.yml instead.
  rust-licenses:
    name: Rust dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Check Rust dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: src-tauri/Cargo.toml
          command: check licenses

  rust-check:
    name: Rust compile and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust-build
        with:
          cache-save: ${{ github.ref == 'refs/heads/main' }}
      - name: Run Rust gates
        run: pnpm check:rust
      - name: Compile desktop application
        run: pnpm package --no-bundle --debug
      - name: Verify generated Rust, TypeScript and Python contracts
        if: ${{ !cancelled() && matrix.os == 'macos-15' }}
        run: npm run contracts:check
      - name: Verify dependency inputs were not rewritten
        run: git diff --exit-code -- src-tauri/Cargo.toml src-tauri/Cargo.lock

  rust:
    name: Rust quality
    needs: [rust-licenses, rust-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Rust gates to pass
        env:
          LICENSES_RESULT: ${{ needs.rust-licenses.result }}
          CHECK_RESULT: ${{ needs.rust-check.result }}
        run: |
          test "$LICENSES_RESULT" = "success"
          test "$CHECK_RESULT" = "success"
