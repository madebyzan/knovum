name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          check-latest: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:web
      - name: Run web gates
        run: pnpm check:web
      - name: Apply canonical formatting to PR branch
        if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          pnpm exec oxfmt .
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply oxfmt"
          git push origin "HEAD:$HEAD_REF"

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev             protobuf-compiler
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Verify Rust architecture boundaries
        run: node tools/check-rust-architecture.mjs
      - name: Verify Rust toolchain
        run: rustc --version && cargo --version
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses
      - name: Run Rust gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
