name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm check:scripts

  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Check Python worker
        run: npm run check:python
      - name: Audit locked Python dependencies
        run: npm run security:python

  web:
    name: Web and source quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          check-latest: false
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:web
      - name: Run web gates
        run: pnpm check:web

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses

  rust-check:
    name: Rust compile and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - run: corepack enable && pnpm install --frozen-lockfile
        shell: bash
      - uses: ./.github/actions/setup-rust-build
      - name: Prepare inference suppliers
        run: node scripts/runtime/inference/preparation.mjs
      - name: Run Rust gates
        run: pnpm check:rust
      - name: Compile desktop application
        run: pnpm exec tauri build --no-bundle --debug
      - name: Verify generated Rust, TypeScript and Python contracts
        if: ${{ !cancelled() && matrix.os == 'macos-15' }}
        run: npm run contracts:check
      - name: Verify dependency inputs were not rewritten
        run: git diff --exit-code -- src-tauri/Cargo.toml src-tauri/Cargo.lock

  rust:
    name: Rust quality
    needs: [rust-audit, rust-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Rust gates to pass
        env:
          AUDIT_RESULT: ${{ needs.rust-audit.result }}
          CHECK_RESULT: ${{ needs.rust-check.result }}
        run: |
          test "$AUDIT_RESULT" = "success"
          test "$CHECK_RESULT" = "success"
