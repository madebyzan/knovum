name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          check-latest: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:web
      - name: Run web gates
        run: pnpm check:web
      - name: Prepare formatting repair for failed checks
        if: failure()
        run: |
          pnpm exec oxfmt .
          git diff --binary > "$RUNNER_TEMP/web-format.patch"
      - name: Upload formatting repair
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-format-repair
          path: ${{ runner.temp }}/web-format.patch
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             build-essential             curl             wget             file             libxdo-dev             libssl-dev             libayatana-appindicator3-dev             librsvg2-dev
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Verify capability permission policy
        run: node tools/check-capability-policy.mjs
      - name: Verify Rust module boundaries
        run: node tools/check-rust-boundaries.mjs
      - name: Verify Rust toolchain
        run: rustc --version && cargo --version
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses
      - name: Run Rust gates
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare formatting repair for failed checks
        if: failure()
        run: |
          git ls-files -z '*.rs' | xargs -0 rustfmt --edition 2021 --config skip_children=true
          git diff --binary > "$RUNNER_TEMP/rust-format.patch"
      - name: Upload formatting repair
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-format-repair
          path: ${{ runner.temp }}/rust-format.patch
          if-no-files-found: ignore
          retention-days: 7
