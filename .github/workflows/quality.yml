name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile
      - run: pnpm check:scripts

  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Check Python worker
        run: npm run check:python
      - name: Audit locked Python dependencies
        run: npm run security:python

  web:
    name: Web and source quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          check-latest: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:web
      - name: Run web gates
        run: pnpm check:web
      - name: Check Rust duplication
        run: pnpm exec jscpd src-tauri/src src-tauri/crates --min-lines 6 --min-tokens 80 --threshold 1

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses

  rust-check:
    name: Rust compile and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - uses: ./.github/actions/setup-protoc
      - run: corepack enable && corepack prepare pnpm@11.17.0 --activate && pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-build
      - name: Prepare native worker and suppliers
        run: node scripts/runtime/native-worker.mjs
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Verify source and capability boundaries
        run: |
          node scripts/checks/source-layout.mjs rust
          node scripts/checks/capabilities.mjs
      - name: Verify Rust toolchain
        id: toolchain
        run: rustc --version && cargo --version
      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Run Rust unit tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace
      - name: Verify generated Rust, TypeScript and Python contracts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: npm run contracts:check
      - name: Verify dependency inputs were not rewritten
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: git diff --exit-code -- src-tauri/Cargo.toml src-tauri/Cargo.lock

  rust:
    name: Rust quality
    needs: [rust-audit, rust-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Rust gates to pass
        env:
          AUDIT_RESULT: ${{ needs.rust-audit.result }}
          CHECK_RESULT: ${{ needs.rust-check.result }}
        run: |
          test "$AUDIT_RESULT" = "success"
          test "$CHECK_RESULT" = "success"
