name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-manifest:
    name: Runtime manifest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: node --test tools/__tests__/runtime-manifest.test.mjs tools/__tests__/write-python-runtime-manifest.test.mjs tools/__tests__/runtime-package.test.mjs tools/__tests__/runtime-license-policy.test.mjs

  python:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Check Python worker
        run: npm run check:python
      - name: Audit locked Python dependencies
        run: uv audit --project python --locked

  web:
    name: Web quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          check-latest: false
      - name: Verify Tauri configuration invariants
        run: node --test tools/__tests__/tauri-config.test.mjs
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Require committed lockfile
        run: test -f pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm security:web
      - name: Run web gates
        run: pnpm check:web

  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses

  rust-check:
    name: Rust compile and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - uses: ./.github/actions/setup-protoc
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev fontconfig fonts-noto-cjk
          test "$(fc-match -f '%{family}' 'Noto Sans CJK SC')" = "Noto Sans CJK SC"
      - name: Require committed lockfile
        run: test -f src-tauri/Cargo.lock
      - name: Verify capability permission policy
        run: node tools/check-capability-policy.mjs
      - name: Verify Rust module boundaries
        run: node tools/check-rust-boundaries.mjs
      - name: Verify Rust toolchain
        id: toolchain
        run: rustc --version && cargo --version
      - name: Check Rust formatting
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Run Clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Run Rust unit tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify generated Rust, TypeScript and Python contracts
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          npm run contracts:generate
          uv run --project python --only-group contracts --frozen python python/tools/generate_contracts.py
          git diff --exit-code -- src/shared/contracts/generated src/features/spaces/contracts/generated python/schemas/runtime.schema.json python/src/knovum_inference/contracts.py
      - name: Verify dependency inputs were not rewritten
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: git diff --exit-code -- src-tauri/Cargo.toml src-tauri/Cargo.lock

  rust:
    name: Rust quality
    needs: [rust-audit, rust-check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both Rust gates to pass
        env:
          AUDIT_RESULT: ${{ needs.rust-audit.result }}
          CHECK_RESULT: ${{ needs.rust-check.result }}
        run: |
          test "$AUDIT_RESULT" = "success"
          test "$CHECK_RESULT" = "success"
