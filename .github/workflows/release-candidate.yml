name: Desktop packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tag, notes and advisories are platform-independent, so they are decided once on the cheapest
  # runner. Running them inside the matrix paid for them three times on billed desktop runners and
  # delayed the first build by their duration.
  prepare:
    name: Validate tag and audit dependencies
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a release commit on main
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.23"
      - name: Install locked dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Validate tag and reviewed release notes
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e 'import { readVersion } from "./scripts/desktop/packaging-policy.mjs"; import { accessSync } from "node:fs"; const version = readVersion(process.cwd()); if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag and package version differ"); accessSync(`docs/release-notes/${version}.md`);'
      - name: Audit web and Python dependencies against current advisories
        run: pnpm security:web && pnpm security:python
      - name: Audit Rust dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.97.1"
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses
      - name: Read reviewed release notes
        id: notes
        if: github.event_name == 'push'
        run: |
          echo 'body<<KNOVUM_RELEASE_NOTES' >> "$GITHUB_OUTPUT"
          cat "docs/release-notes/${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"
          echo >> "$GITHUB_OUTPUT"
          echo KNOVUM_RELEASE_NOTES >> "$GITHUB_OUTPUT"

  build:
    name: Package ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      # Serialized: the Tauri action reads, merges and rewrites one shared `latest.json`, so
      # parallel platforms would publish an updater manifest missing the platforms they raced.
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin-aarch64
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            bundles: app,dmg
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The quality workflow gates this commit on main across all three platforms before a tag can
      # point at it, so this job only produces the packages its gates already admitted.
      - uses: ./.github/actions/setup-rust-build
        with:
          cache: "false"
      - name: Add the release target
        shell: bash
        run: rustup target add '${{ matrix.target }}'
      - name: Build and upload a signed draft with the official Tauri action
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KNOVUM_UPDATER_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          KNOVUM_UPDATER_PUBKEY: ${{ vars.KNOVUM_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          tauriScript: node scripts/desktop/tauri.mjs
          args: --release --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: Knovum ${{ github.ref_name }}
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Build QA package
        if: github.event_name == 'workflow_dispatch'
        run: pnpm package --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: qa-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
