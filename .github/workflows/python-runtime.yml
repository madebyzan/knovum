name: Controlled Deep Agent runtime

on:
  workflow_dispatch:
    inputs:
      production:
        description: Sign the runtime for production (requires configured native certificates)
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-15
            target: macos-arm64
            signing: adhoc
          - os: macos-15-intel
            target: macos-x64
            signing: adhoc
          - os: windows-2025
            target: windows-x64
            signing: unsigned
    runs-on: ${{ matrix.platform.os }}
    environment: ${{ inputs.production && 'release-signing' || 'runtime-qa' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Audit locked Python dependency graph
        run: uv audit --project python/runtimes/agent --locked --no-default-groups --output-format json
      - name: Require main for a controlled publication
        shell: bash
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Import macOS signing certificate
        if: inputs.production && runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Import Windows signing certificate
        if: inputs.production && runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.KNOVUM_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.KNOVUM_WINDOWS_CERTIFICATE_PASSWORD }}
          APPROVED_THUMBPRINT: ${{ vars.KNOVUM_WINDOWS_CERTIFICATE_THUMBPRINT }}
        shell: pwsh
        run: |
          if (!$env:WINDOWS_CERTIFICATE) { throw 'Missing KNOVUM_WINDOWS_CERTIFICATE' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'runtime-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $certificatePath -Password $password -CertStoreLocation Cert:\CurrentUser\My)
          $signers = @($certificates | Where-Object { $_.HasPrivateKey })
          if (!$env:APPROVED_THUMBPRINT) { throw 'Missing approved resource certificate thumbprint' }
          if ($signers.Count -eq 1 -and $signers[0].Thumbprint -ne $env:APPROVED_THUMBPRINT) { throw 'Resource signer differs from the approved certificate' }
          if ($signers.Count -ne 1) { throw 'Expected exactly one private signing certificate' }
          "KNOVUM_WINDOWS_CERTIFICATE_THUMBPRINT=$($signers[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build locked runtime and verify relocation
        env:
          KNOVUM_RUNTIME_ARCHIVE_BASE_URL: https://github.com/${{ vars.KNOVUM_DISTRIBUTION_REPOSITORY }}/releases/download/runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          KNOVUM_WINDOWS_SIGNTOOL: ${{ vars.KNOVUM_WINDOWS_SIGNTOOL }}
          KNOVUM_WINDOWS_TIMESTAMP_URL: ${{ vars.KNOVUM_WINDOWS_TIMESTAMP_URL }}
        shell: bash
        run: npm run runtime:build -- --profile agent --output runtime-artifacts --signing ${{ inputs.production && 'production' || matrix.platform.signing }} --archive-url "$KNOVUM_RUNTIME_ARCHIVE_BASE_URL/python-agent-${{ matrix.platform.target }}.tar.gz"
      - name: Name the target descriptor
        shell: bash
        run: mv runtime-artifacts/runtime-descriptor.json runtime-artifacts/python-agent-${{ matrix.platform.target }}-descriptor.json
      - name: Attest Agent archives and descriptor
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            runtime-artifacts/*.tar.gz
            runtime-artifacts/*-descriptor.json
      - uses: actions/upload-artifact@v6
        with:
          name: python-agent-${{ matrix.platform.target }}
          path: |
            runtime-artifacts/*.tar.gz
            runtime-artifacts/*-descriptor.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove Windows signing material
        if: always() && inputs.production && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:KNOVUM_WINDOWS_CERTIFICATE_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:KNOVUM_WINDOWS_CERTIFICATE_THUMBPRINT" }
          Remove-Item -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'runtime-signing.pfx')

  publish:
    needs: runtime
    runs-on: ubuntu-24.04
    environment: release-publish
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: python-agent-*
          path: runtime-artifacts
          merge-multiple: true
      - name: Publish Agent resources to the public distribution repository
        env:
          GH_TOKEN: ${{ secrets.KNOVUM_DISTRIBUTION_TOKEN }}
          DISTRIBUTION_REPOSITORY: ${{ vars.KNOVUM_DISTRIBUTION_REPOSITORY }}
          RUNTIME_TAG: runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test "$(gh repo view "$DISTRIBUTION_REPOSITORY" --json visibility --jq .visibility)" = PUBLIC
          gh release create "$RUNTIME_TAG" runtime-artifacts/* --repo "$DISTRIBUTION_REPOSITORY" --target main --title "Deep Agent $GITHUB_SHA" --notes "Controlled Agent runtime, descriptor and corresponding build evidence from $GITHUB_REPOSITORY at $GITHUB_SHA." --prerelease --latest=false
