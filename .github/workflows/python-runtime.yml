name: Controlled Python runtime

on:
  workflow_dispatch:
    inputs:
      production:
        description: Sign the runtime for production (requires configured native certificates)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        profile: [resources, light-inference, torch-inference, voice-generation, agent]
        platform:
          - os: macos-15
            target: macos-arm64
            signing: adhoc
          - os: macos-15-intel
            target: macos-x64
            signing: adhoc
          - os: windows-2025
            target: windows-x64
            signing: unsigned
    runs-on: ${{ matrix.platform.os }}
    environment: ${{ inputs.production && 'release-signing' || 'runtime-qa' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - name: Audit locked Python dependency graph
        run: uv audit --project python/runtimes/${{ matrix.profile }} --locked --no-default-groups --output-format json
      - name: Import macOS signing certificate
        if: inputs.production && runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; if(!process.env.APPLE_CERTIFICATE) throw Error("Missing APPLE_CERTIFICATE"); writeFileSync(`${process.env.RUNNER_TEMP}/runtime-signing.p12`, Buffer.from(process.env.APPLE_CERTIFICATE,"base64"), {mode:0o600});'
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/runtime-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/runtime-signing.keychain-db"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/runtime-signing.keychain-db"
          security import "$RUNNER_TEMP/runtime-signing.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/runtime-signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$RUNNER_TEMP/runtime-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/runtime-signing.keychain-db"
      - name: Import Windows signing certificate
        if: inputs.production && runner.os == 'Windows'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.KNOVUM_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.KNOVUM_WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:WINDOWS_CERTIFICATE) { throw 'Missing KNOVUM_WINDOWS_CERTIFICATE' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'runtime-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificates = @(Import-PfxCertificate -FilePath $certificatePath -Password $password -CertStoreLocation Cert:\CurrentUser\My)
          $signers = @($certificates | Where-Object { $_.HasPrivateKey })
          if ($signers.Count -ne 1) { throw 'Expected exactly one private signing certificate' }
          "KNOVUM_WINDOWS_CERTIFICATE_THUMBPRINT=$($signers[0].Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build locked runtime and verify relocation
        env:
          KNOVUM_RUNTIME_ARCHIVE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          KNOVUM_WINDOWS_SIGNTOOL: ${{ vars.KNOVUM_WINDOWS_SIGNTOOL }}
          KNOVUM_WINDOWS_TIMESTAMP_URL: ${{ vars.KNOVUM_WINDOWS_TIMESTAMP_URL }}
        shell: bash
        run: npm run runtime:build -- --profile ${{ matrix.profile }} --output runtime-artifacts --signing ${{ inputs.production && 'production' || matrix.platform.signing }} --archive-url "$KNOVUM_RUNTIME_ARCHIVE_BASE_URL/python-${{ matrix.profile }}-${{ matrix.platform.target }}.tar.gz"
      - name: Name the target descriptor
        shell: bash
        run: mv runtime-artifacts/runtime-descriptor.json runtime-artifacts/python-${{ matrix.profile }}-${{ matrix.platform.target }}-descriptor.json
      - name: Produce locked core media and verify relocation
        if: matrix.profile == 'light-inference'
        env:
          KNOVUM_RUNTIME_ARCHIVE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          KNOVUM_WINDOWS_SIGNTOOL: ${{ vars.KNOVUM_WINDOWS_SIGNTOOL }}
          KNOVUM_WINDOWS_TIMESTAMP_URL: ${{ vars.KNOVUM_WINDOWS_TIMESTAMP_URL }}
        shell: bash
        run: node scripts/runtime/media.mjs --output core-media-artifacts --signing ${{ inputs.production && 'production' || matrix.platform.signing }} --archive-url "$KNOVUM_RUNTIME_ARCHIVE_BASE_URL/ffmpeg-${{ matrix.platform.target }}.tar.gz"
      - name: Attest produced archive
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: runtime-artifacts/python-${{ matrix.profile }}-${{ matrix.platform.target }}.tar.gz
      - name: Attest core media archive
        if: matrix.profile == 'light-inference'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: core-media-artifacts/ffmpeg-${{ matrix.platform.target }}.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: python-${{ matrix.profile }}-${{ matrix.platform.target }}
          path: |
            runtime-artifacts/*.tar.gz
            runtime-artifacts/*-descriptor.json
            core-media-artifacts/*.tar.gz
            core-media-artifacts/*-descriptor.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove macOS signing material
        if: always() && inputs.production && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/runtime-signing.keychain-db"
          rm -f "$RUNNER_TEMP/runtime-signing.p12"
      - name: Remove Windows signing material
        if: always() && inputs.production && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:KNOVUM_WINDOWS_CERTIFICATE_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:KNOVUM_WINDOWS_CERTIFICATE_THUMBPRINT" }
          Remove-Item -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'runtime-signing.pfx')

  publish:
    needs: runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          pattern: python-*
          path: runtime-publication
          merge-multiple: true
      - name: Verify the complete native publication
        env:
          ARCHIVE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: node --input-type=module -e 'import { writePublication } from "./scripts/runtime/publication.mjs"; writePublication("runtime-publication", process.env.ARCHIVE_BASE_URL);'
      - name: Publish immutable local resources
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: gh release create "$RUNTIME_TAG" runtime-publication/* --target "$GITHUB_SHA" --title "Local resources $GITHUB_SHA" --notes "Hash-bound native resources and build evidence for macOS arm64, macOS x64 and Windows x64." --prerelease --latest=false
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-publication
          path: runtime-publication/runtime-publication.json
          if-no-files-found: error
