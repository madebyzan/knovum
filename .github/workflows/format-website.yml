name: Format website sources

on:
  push:
    branches:
      - feat/knovum-marketing-website
    paths:
      - "website/**"
      - ".github/workflows/format-website.yml"

permissions:
  contents: write

concurrency:
  group: format-website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Format website sources with repository-pinned Oxfmt
        run: pnpm exec oxfmt website
      - name: Commit formatter output
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website
          if git diff --cached --quiet; then
            echo "Website sources already match Oxfmt."
            exit 0
          fi
          git commit -m "style(website): format marketing site sources"
          git push origin "HEAD:${BRANCH}"
