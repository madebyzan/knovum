name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_BASE_URL: https://madebyzan.github.io/knovum

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure optional Cloudflare Web Analytics
        env:
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          token = os.environ.get("CLOUDFLARE_WEB_ANALYTICS_TOKEN", "").strip()
          if token and not re.fullmatch(r"[A-Za-z0-9_-]{16,128}", token):
              raise SystemExit("CLOUDFLARE_WEB_ANALYTICS_TOKEN has an unexpected format")
          path = Path("website/script.js")
          source = path.read_text(encoding="utf-8")
          marker = 'const CLOUDFLARE_WEB_ANALYTICS_TOKEN = "";'
          if source.count(marker) != 1:
              raise SystemExit("Cloudflare Web Analytics token marker was not found exactly once")
          path.write_text(
              source.replace(marker, "const CLOUDFLARE_WEB_ANALYTICS_TOKEN = " + json.dumps(token) + ";"),
              encoding="utf-8",
          )
          PY
      - name: Render localized social cards
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin fonts-noto-cjk
          cp public/app-icon.png website/assets/app-icon.png
          rsvg-convert --width 1200 --height 630 --output website/assets/social-card.png website/assets/social-card.svg
          rsvg-convert --width 1200 --height 630 --output website/assets/social-card-zh.png website/assets/social-card-zh.svg
      - name: Generate SEO metadata and sitemap
        run: |
          python3 website/scripts/generate_sitemap.py \
            --base-url "$SITE_BASE_URL" \
            --apply-html
      - name: Validate deployable website
        run: |
          node --check website/script.js
          python3 website/scripts/check_site.py \
            --require-seo-output \
            --expected-base-url "$SITE_BASE_URL"
      - name: Stage only public website files
        run: |
          mkdir -p website/_site
          cp website/*.html website/_site/
          cp website/styles.css website/script.js website/robots.txt website/sitemap.xml website/_site/
          cp -R website/assets website/guides website/zh website/_site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
