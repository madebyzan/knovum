name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE_BASE_URL: https://madebyzan.github.io/knovum

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Render social sharing card as PNG
        run: |
          sudo apt-get update
          sudo apt-get install --yes librsvg2-bin
          rsvg-convert --width 1200 --height 630 --output website/assets/social-card.png website/assets/social-card.svg
      - name: Generate production SEO metadata and sitemap
        run: |
          python3 website/scripts/generate_sitemap.py \
            --base-url "$SITE_BASE_URL" \
            --apply-html
          find website -name "*.html" -exec sed -i "s|https://madebyzan.github.io/knovum/assets/social-card.png|$SITE_BASE_URL/assets/social-card.png|g" {} +
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
