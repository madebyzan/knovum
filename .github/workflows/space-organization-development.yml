name: Space organization development

# Temporary PR-14 development runner; it never runs default-branch or fork code.
on:
  push:
    branches: [refactor/space-organization]
    paths:
      - .github/workflows/space-organization-development.yml
      - tools/space-organization-development/**
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'

jobs:
  snapshot:
    if: github.repository == 'madebyzan/knovum' && github.ref == 'refs/heads/refactor/space-organization'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture the exact tracked source without materializing runtime LFS assets
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/source-checkpoint"
          git rev-parse HEAD > "$RUNNER_TEMP/source-checkpoint/commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/source-checkpoint/tree.txt"
          git -c filter.lfs.process= -c filter.lfs.smudge= -c filter.lfs.required=false archive --format=tar.gz --output="$RUNNER_TEMP/source-checkpoint/source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: organization-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-checkpoint
          retention-days: 7
          if-no-files-found: error

  verify:
    if: github.repository == 'madebyzan/knovum' && github.ref == 'refs/heads/refactor/space-organization'
    concurrency:
      group: space-organization-source
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
    outputs:
      source: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply reviewed source changes
        run: python3 tools/space-organization-development/apply.py
      - name: Format changed frontend source
        run: git ls-files -m -o --exclude-standard -z -- '*.ts' '*.vue' '*.mjs' '*.json' '*.md' | xargs -0 -r pnpm exec oxfmt
      - name: Save changes on the same branch
        id: save
        run: |
          git add -- src src-tauri docs tools package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'refactor(spaces): apply reviewed organization integration step'
            git push origin HEAD:refs/heads/refactor/space-organization
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Run complete frontend checks
        id: verification
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/organization-report
          NO_COLOR: '1'
        run: python3 tools/space-organization-development/verify.py
      - name: Upload frontend evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: organization-${{ steps.save.outputs.sha }}
          path: ${{ runner.temp }}/organization-report
          retention-days: 7
          if-no-files-found: warn
      - name: Save line-addressable frontend diagnostics
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/organization-report
        run: |
          test -f "$REPORT_DIRECTORY/report.md"
          mkdir -p tools/space-organization-development/last-run
          cp "$REPORT_DIRECTORY"/*.md tools/space-organization-development/last-run/
          git add -- tools/space-organization-development/last-run
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: record organization integration diagnostics'
            git push origin HEAD:refs/heads/refactor/space-organization
          fi
      - name: Report actual frontend results
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        uses: actions/github-script@v9
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/organization-report
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const report = path.join(process.env.REPORT_DIRECTORY, 'report.md');
            if (!fs.existsSync(report)) { core.setFailed('Verification produced no report'); return; }
            await github.rest.issues.createComment({ ...context.repo, issue_number: 14, body: fs.readFileSync(report, 'utf8') });

  native:
    # Explicit native checkpoints avoid rebuilding the full inference/document toolchain on every edit.
    needs: verify
    if: ${{ !cancelled() && needs.verify.outputs.source != '' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[native]')) }}
    concurrency:
      group: space-organization-native
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '0'
      CARGO_INCREMENTAL: '0'
      SOURCE_SHA: ${{ needs.verify.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify.outputs.source }}
          persist-credentials: true
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev protobuf-compiler
      - name: Restore native dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: organization-native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            organization-native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-
      - name: Check native code and every test target
        id: native_check
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-report"
          rustc --version | tee "$RUNNER_TEMP/native-report/toolchain.log"
          cargo --version | tee -a "$RUNNER_TEMP/native-report/toolchain.log"
          set +e
          cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format=short > "$RUNNER_TEMP/native-report/check.log" 2>&1
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          printf '# Native compile and test-type check\n\nSource: `%s`. Exit code: %s. This is a compiler check, not a desktop or runtime test pass.\n\n```text\n' "$SOURCE_SHA" "$result" > "$RUNNER_TEMP/native-report/report.md"
          cat "$RUNNER_TEMP/native-report/check.log" >> "$RUNNER_TEMP/native-report/report.md"
          printf '\n```\n' >> "$RUNNER_TEMP/native-report/report.md"
          tail -180 "$RUNNER_TEMP/native-report/check.log"
          exit "$result"
      - name: Save native dependency cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: organization-native-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'src-tauri/Cargo.lock') }}-${{ github.run_id }}
      - name: Upload native evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: organization-native-${{ needs.verify.outputs.source }}
          path: ${{ runner.temp }}/native-report
          retention-days: 7
          if-no-files-found: warn
      - name: Publish exact-source native diagnostics
        if: ${{ !cancelled() && steps.native_check.outputs.exit_code != '' }}
        shell: bash
        run: |
          git fetch origin refs/heads/refactor/space-organization
          git worktree add --detach "$RUNNER_TEMP/native-report-tree" FETCH_HEAD
          destination="$RUNNER_TEMP/native-report-tree/tools/space-organization-development/last-native"
          mkdir -p "$destination"
          cp "$RUNNER_TEMP/native-report/report.md" "$destination/report.md"
          cd "$RUNNER_TEMP/native-report-tree"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/space-organization-development/last-native/report.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record exact-source native compilation diagnostics'
            git push origin HEAD:refs/heads/refactor/space-organization
          fi
