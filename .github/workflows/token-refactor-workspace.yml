name: Token refactor workspace

on:
  push:
    branches: [refactor/tailwind-token-system]
    paths:
      - .github/workflows/token-refactor-workspace.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Archive tracked source for token verification
        run: git archive --format=tar.gz HEAD -o "$RUNNER_TEMP/knovum-source.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: knovum-token-source
          path: ${{ runner.temp }}/knovum-source.tar.gz
          retention-days: 1
          if-no-files-found: error
