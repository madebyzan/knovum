name: Update release policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  release-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Exercise publishing policy and actual signature rejection
        run: |
          node --test tools/*/__tests__/*.test.mjs
          node --test tools/release/__tests__/*.integration.mjs
