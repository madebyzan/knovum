name: Website quality

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"

permissions:
  contents: read

jobs:
  website:
    name: Static website checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check website JavaScript
        run: node --check website/script.js
      - name: Validate website pages, links, and assets
        run: python3 website/scripts/check_site.py
