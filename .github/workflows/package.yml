name: QA packages

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  runtimes:
    uses: ./.github/workflows/python-runtime.yml
    with:
      production: false
    secrets: inherit
  package:
    needs: runtimes
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            command: pnpm package --bundles app,dmg
            artifact: knovum-macos-arm64-qa
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: macOS Intel
            os: macos-15-intel
            command: pnpm package --bundles app,dmg
            artifact: knovum-macos-x64-qa
            paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - name: Windows
            os: windows-2025
            command: pnpm package --bundles nsis
            artifact: knovum-windows-qa
            paths: |
              src-tauri/target/release/bundle/nsis/*-setup.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          check-latest: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
      - uses: ./.github/actions/setup-protoc
      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - name: Require committed lockfiles
        shell: bash
        run: |
          test -f pnpm-lock.yaml
          test -f src-tauri/Cargo.lock
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: runtime-publication
          path: runtime-publication
      - name: Provision published native resources
        run: |
          pnpm runtime:provision --profile resources --publication runtime-publication/runtime-publication.json
          pnpm runtime:provision --profile light-inference --publication runtime-publication/runtime-publication.json
          pnpm runtime:provision --profile torch-inference --publication runtime-publication/runtime-publication.json
          pnpm runtime:provision --profile voice-generation --publication runtime-publication/runtime-publication.json
          pnpm runtime:provision --profile agent --publication runtime-publication/runtime-publication.json
      - name: Audit production web dependencies
        run: pnpm security:web
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Audit Rust dependencies
        run: cargo deny --manifest-path src-tauri/Cargo.toml check advisories licenses
      - name: Run quality gates
        run: pnpm check
      - name: Smoke provisioned bundled runtime
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test local_resources_smoke -- --ignored
      - name: Build QA package
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos-') && '-' || '' }}
        run: ${{ matrix.command }}
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14
