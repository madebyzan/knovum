name: Format updater review branch

on:
  push:
    branches: [feat/signed-auto-updates]
    paths: [.github/workflows/updater-format-once.yml]

permissions:
  contents: read

jobs:
  format:
    if: github.repository == 'madebyzan/knovum' && github.ref == 'refs/heads/feat/signed-auto-updates'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
      - name: Install locked formatting tools
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply project formatters
        run: |
          pnpm exec oxfmt .
          git ls-files -z '*.rs' | xargs -0 rustfmt --edition 2021 --config skip_children=true
          git diff --check
      - name: Verify release and save policies
        run: node --experimental-strip-types --test tools/release/*.test.mjs tools/update-tests/*.test.mjs
      - name: Commit formatting only to the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(updater): apply pinned Oxfmt and rustfmt'
          git -c credential.helper='!gh auth git-credential' push origin HEAD:refs/heads/feat/signed-auto-updates
      - name: Run full web gates
        run: pnpm check:web
