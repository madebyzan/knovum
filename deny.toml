[advisories]
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38.3 is locked by the published citationberg 0.7.0 in Typst's bibliography stack; Knovum does not expose bibliography/CSL input and its Typst source generator never emits bibliography constructs. Remove when the published Typst/Hayagriva/Citationberg chain accepts quick-xml >=0.41." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38.3 is locked by the published citationberg 0.7.0 in Typst's bibliography stack; Knovum does not expose bibliography/CSL input and its Typst source generator never emits bibliography constructs. Remove when the published Typst/Hayagriva/Citationberg chain accepts quick-xml >=0.41." },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

[licenses.private]
ignore = true
