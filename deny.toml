# Audit every supported release target.
# Custom cfg(fuzzing) dependencies are not part of these application builds.
# Adding fuzzing or another shipping target requires its own matching audit scope.
[graph]
all-features = true
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-apple-darwin"]

[advisories]
unmaintained = "none"
# zstd reaches this build only transitively, through the exact-pinned lancedb =0.37.1, whose
# arrow-ipc 58 and lance-encoding 10 still require zstd ^0.13. The patched zstd 0.14.3 and
# zstd-safe 8.2.0 are therefore unreachable without upgrading the vector store, so each entry
# below records why the affected API is not reached meanwhile. Upgrading lancedb and arrow
# retires all three; adding another ignored advisory here does not.
ignore = [
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  { id = "RUSTSEC-2026-0391", reason = "affects stream::raw::{Encoder,Decoder}::with_context, which neither arrow-ipc nor lance-encoding calls" },
  { id = "RUSTSEC-2026-0398", reason = "affects seekable::Seekable::decompress, and the seekable feature is not enabled; enabled are arrays, legacy, std, zdict_builder" },
  { id = "RUSTSEC-2026-0403", reason = "affects stream::write::Decoder; dependents use only zstd::bulk and stream::copy_decode, which the advisory lists as unaffected" },
  # zip 8.6.0 stays in the graph only through exact-pinned dependents whose latest releases
  # still require zip ^8.6: docx-rs =0.4.22 in the app crate, oar-ocr =0.10.2 and
  # candle-core =0.11.0 in the sealed inference worker. The advisory lives in the symlink
  # branch of ZipArchive::extract_internal, which only the extract()/extract_to() family
  # reaches; all three dependents read zip entries into memory (Cursor/BufReader with
  # by_index/by_name) and never extract to disk, and oar-ocr and candle-core read only
  # SHA-256-pinned model archives. Every untrusted-archive extraction the application owns
  # (Space packages, books, plugin sources, file inspection, updater) runs on zip 9.3.0.
  # Upgrading docx-rs, oar-ocr and candle-core to zip 9 releases retires this entry; adding
  # another ignored advisory here does not.
  { id = "RUSTSEC-2026-0429", reason = "affects the symlink branch of ZipArchive::extract_internal reached only through extract()/extract_to(); docx-rs, oar-ocr and candle-core read entries into memory and never call them" },
  # libsqlite3-sys 0.37.0 bundles SQLite 3.51.3 and reaches this build only through sqlx 0.9.0, the
  # newest published sqlx, whose sqlx-sqlite requires libsqlite3-sys >=0.30.1, <0.38.0. The patched
  # 0.39 is unreachable until sqlx publishes a release that admits it. The advisory needs a database
  # opened beside a foreign -wal whose page size differs from the database's. Knovum opens databases
  # only under its managed roots, backup restore admits the three exact database paths in
  # backup::contracts::ROOTS and rejects every sidecar before staging, and its own snapshots are
  # VACUUM INTO copies that carry no WAL. Upgrading sqlx past that bound retires this entry; adding
  # another ignored advisory here does not.
  { id = "RUSTSEC-2026-0459", reason = "needs a foreign sibling -wal with a mismatched page size; restore stages only the exact ROOTS database paths and no sidecar, and live WAL files are written by Knovum itself" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
