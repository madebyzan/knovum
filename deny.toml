# Audit every supported release target.
# Custom cfg(fuzzing) dependencies are not part of these application builds.
# Adding fuzzing or another shipping target requires its own matching audit scope.
[graph]
all-features = true
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-apple-darwin"]

[advisories]
unmaintained = "none"
# zstd reaches this build only transitively, through the exact-pinned lancedb =0.37.1, whose
# arrow-ipc 58 and lance-encoding 10 still require zstd ^0.13. The patched zstd 0.14.3 and
# zstd-safe 8.2.0 are therefore unreachable without upgrading the vector store, so each entry
# below records why the affected API is not reached meanwhile. Upgrading lancedb and arrow
# retires all three; adding another ignored advisory here does not.
ignore = [
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
  { id = "RUSTSEC-2026-0391", reason = "affects stream::raw::{Encoder,Decoder}::with_context, which neither arrow-ipc nor lance-encoding calls" },
  { id = "RUSTSEC-2026-0398", reason = "affects seekable::Seekable::decompress, and the seekable feature is not enabled; enabled are arrays, legacy, std, zdict_builder" },
  { id = "RUSTSEC-2026-0403", reason = "affects stream::write::Decoder; dependents use only zstd::bulk and stream::copy_decode, which the advisory lists as unaffected" },
  # libsais-rs 0.2.2 is yanked upstream, but remains a transitive dependency of
  # lance-index 10.0.0, pulled in by the exact-pinned lancedb =0.37.1 used by the
  # local LanceDB retrieval index. The release lockfile retains its published checksum
  # and no alternate non-yanked release is available within this dependency constraint.
  # Do not silently admit yanked dependencies: cargo-deny reports this one explicitly
  # so any future LanceDB upgrade can remove the exception and refresh the lockfile.
  # zip 8.6.0 stays in the graph only through docx-rs =0.4.22 (its newest published release,
  # which requires zip ^8.6). Knovum calls docx-rs solely in `documents::generation::docx` via
  # `Docx::build().pack(&mut cursor)` to generate `.docx` output, enabling only `zip` deflate
  # features (neither `aes-crypto` nor `legacy-zip` is enabled) and never calling
  # `ZipArchive::extract`, `ZipStreamReader`, or `by_name_decrypt`. Every untrusted-archive
  # extraction the application owns (Space packages, books, plugin sources, file inspection,
  # updater) runs on zip 9.3.0. Upgrading docx-rs to a zip 9 release retires these entries;
  # adding another ignored advisory here does not.
  { id = "RUSTSEC-2026-0429", reason = "affects ZipArchive::extract()/extract_to(); docx-rs only packs generated DOCX output in memory and never extracts archives" },
  { id = "RUSTSEC-2026-0545", reason = "affects AES entries via aes-crypto/by_name_decrypt; aes-crypto is not enabled on zip 8.6.0 and docx-rs only generates DOCX output" },
  { id = "RUSTSEC-2026-0546", reason = "affects ZipArchive::extract()/extract_unwrapped_root_dir(); docx-rs only packs generated DOCX output and never calls extract" },
  { id = "RUSTSEC-2026-0547", reason = "affects legacy-zip decoders (Shrink/Reduce/Implode); legacy-zip is not enabled on zip 8.6.0 and docx-rs only generates DOCX output" },
  { id = "RUSTSEC-2026-0548", reason = "affects ZipStreamReader extraction mismatches; docx-rs only packs generated DOCX output and never uses ZipStreamReader" },
  # libsqlite3-sys 0.37.0 bundles SQLite 3.51.3 and reaches this build only through sqlx 0.9.0, the
  # newest published sqlx, whose sqlx-sqlite requires libsqlite3-sys >=0.30.1, <0.38.0. The patched
  # 0.39 is unreachable until sqlx publishes a release that admits it. The advisory needs a database
  # opened beside a foreign -wal whose page size differs from the database's. Knovum opens databases
  # only under its managed roots, backup restore admits the three exact database paths in
  # backup::contracts::ROOTS and rejects every sidecar before staging, and its own snapshots are
  # VACUUM INTO copies that carry no WAL. Upgrading sqlx past that bound retires this entry; adding
  # another ignored advisory here does not.
  { id = "RUSTSEC-2026-0459", reason = "needs a foreign sibling -wal with a mismatched page size; restore stages only the exact ROOTS database paths and no sidecar, and live WAL files are written by Knovum itself" },
  # quick-xml 0.39.4 reaches this build only through object_store =0.13.2, exact-pinned here and
  # shared with the lancedb =0.37.1 / arrow 58 graph, which requires quick-xml ^0.39. The patched
  # 0.41 is therefore unreachable without upgrading object_store and the vector store. object_store
  # parses object-storage XML with the quick-xml serde deserializer and Writer, never NsReader, and
  # its S3 client (the only enabled cloud feature) talks HTTPS to the user's own configured endpoint.
  # Upgrading object_store past quick-xml 0.41 retires both entries; adding another ignored advisory
  # here does not.
  { id = "RUSTSEC-2026-0194", reason = "the quadratic duplicate-attribute check is reached only deserializing well-formed object-storage API responses from the user's own configured HTTPS endpoint, which never carry duplicate attribute names" },
  { id = "RUSTSEC-2026-0195", reason = "affects NsReader namespace resolution; object_store uses the quick-xml serde deserializer and Writer, never NsReader" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
