# Audit every supported release target plus the Linux compile/test target.
# Custom cfg(fuzzing) dependencies are not part of these application builds.
# Adding fuzzing or another shipping target requires its own matching audit scope.
[graph]
all-features = true
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OpenSSL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]

# Only unpublished workspace packages are exempt from declaring an OSS license.
# All third-party dependency licenses remain subject to the allowlist above.
[licenses.private]
ignore = true
