<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Knovum — Bring your knowledge into focus</title>
<desc id="desc">A local-first knowledge workspace for research, connected thinking, and creation.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f1e8"/><stop offset="1" stop-color="#e7e5d9"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34463b"/><stop offset="1" stop-color="#1c2922"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#b7c4a9" stop-opacity=".5"/><stop offset="1" stop-color="#b7c4a9" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#647264" stroke-opacity=".12"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#142019" flood-opacity=".16"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#paper)"/>
<rect width="1200" height="630" fill="url(#grid)"/>
<circle cx="1010" cy="70" r="360" fill="url(#glow)"/>
<g transform="translate(76 70)">
  <rect width="48" height="48" rx="14" fill="#26362c"/>
  <path d="M12 34V14h5l14 13V14h5v20h-5L17 21v13z" fill="#e8e8dc"/>
  <text x="64" y="34" font-family="Arial,Helvetica,sans-serif" font-size="31" letter-spacing="-1.4" fill="#26332b">knovum</text>
  <text x="0" y="112" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="3.6" fill="#758073">A LOCAL-FIRST KNOWLEDGE WORKSPACE</text>
  <text x="0" y="214" font-family="Georgia,serif" font-size="78" letter-spacing="-2.8" fill="#202a23">Bring your knowledge</text>
  <text x="0" y="300" font-family="Georgia,serif" font-size="88" font-style="italic" letter-spacing="-3" fill="#526b57">into focus.</text>
  <text x="2" y="362" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#596259">Research, connect ideas, and create — with your knowledge close.</text>
  <g transform="translate(0 430)" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="1.4" fill="#687368">
    <text x="0" y="0">FREE &amp; OPEN SOURCE</text><circle cx="190" cy="-5" r="3" fill="#b18d65"/>
    <text x="215" y="0">LOCAL-FIRST</text><circle cx="340" cy="-5" r="3" fill="#b18d65"/>
    <text x="365" y="0">SOURCE-GROUNDED</text>
  </g>
</g>
<g transform="translate(790 118)" filter="url(#shadow)">
  <rect width="338" height="390" rx="20" fill="url(#panel)"/>
  <rect x="16" y="16" width="306" height="358" rx="12" fill="url(#grid)" stroke="#d8e0d1" stroke-opacity=".2"/>
  <g fill="none" stroke="#c2d0bd" stroke-opacity=".7" stroke-width="1.5">
    <path d="M85 115L190 82 253 165 160 240 70 218 85 115Z"/>
    <path d="M85 115L160 240M190 82L160 240M253 165L70 218"/>
  </g>
  <g>
    <rect x="49" y="78" width="74" height="74" rx="12" fill="#e8e5d9"/><path d="M66 98h39M66 109h29M66 120h34" stroke="#788474" stroke-width="3" stroke-linecap="round"/>
    <rect x="158" y="48" width="72" height="68" rx="12" fill="#b8c5ad"/><circle cx="194" cy="78" r="14" fill="#526b57"/>
    <rect x="219" y="140" width="76" height="76" rx="12" fill="#d3b28c"/><path d="M238 161h38M238 173h27M238 185h32" stroke="#705b44" stroke-width="3" stroke-linecap="round"/>
    <rect x="127" y="214" width="90" height="88" rx="12" fill="#f0eee4"/><path d="M145 237h54M145 250h44M145 263h50M145 276h34" stroke="#71806e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="67" cy="238" r="20" fill="#9eaf9a"/><circle cx="67" cy="238" r="7" fill="#35473a"/>
  </g>
  <text x="30" y="344" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2.2" fill="#d4dfd0">CONNECT · UNDERSTAND · CREATE</text>
</g>
<path d="M0 596H1200" stroke="#7b887b" stroke-opacity=".25"/>
<text x="1124" y="615" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="10" letter-spacing="2" fill="#788276">KNOVUM.APP / OPEN SOURCE</text>
</svg>