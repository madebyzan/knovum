[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "knovum-agent"
version = "0.1.0"
description = "Knovum Agent process"
license = "LicenseRef-Knovum-Personal-Noncommercial-1.0"
license-files = ["LICENSE"]
requires-python = "==3.11.17"
dependencies = [
  "deepagents==0.7.22",
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.2",
  "langchain-openai==1.6.7",
  "langchain-anthropic==1.7.5",
  "langchain-google-genai==4.4.0",
  "langchain-ollama==1.1.0",
  "langchain-deepseek==1.1.1",
  "langchain-groq==1.1.3",
  "pydantic==2.13.5",
  "truststore==0.10.4",
]

[project.scripts]
knovum-agent = "knovum_agent_runtime.__main__:main"

[dependency-groups]
packaging = [
  "packaging==26.3",
  "pyinstaller==6.22.3",
  "cyclonedx-python-lib[json-validation]==11.12.0",
  "packageurl-python==0.17.6",
]
contracts = ["datamodel-code-generator==0.83.0"]
quality = ["mypy==2.4.0", "pydantic==2.13.5", "pytest==9.1.1", "ruff==0.16.10"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]
extend-exclude = ["**/knovum_agent_runtime/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["knovum_agent_runtime", "policy", "sbom", "distribution", "generate_python_contracts"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "packaging", "contracts"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = []
