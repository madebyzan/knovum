[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "knovum-python"
version = "0.1.0"
description = "Retained Deep Agent worker and its build tooling"
requires-python = "==3.11.17"
dependencies = []

[dependency-groups]
publication = ["cyclonedx-python-lib[json-validation]==11.12.0", "packageurl-python==0.17.6"]
contracts = ["datamodel-code-generator==0.83.0"]
quality = ["mypy==2.4.0", "pydantic==2.13.5", "pytest==9.1.1", "ruff==0.16.10"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]
extend-exclude = ["**/knovum_agent_runtime/contracts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["knovum_agent_runtime", "runtime", "generate_python_contracts"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "../scripts"]
testpaths = ["tests", "../scripts"]

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
default-groups = []
