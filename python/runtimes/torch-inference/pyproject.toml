[project]
name = "knovum-torch-inference-runtime"
version = "0.1.0"
description = "Isolated torch-inference dependencies for Knovum"
requires-python = "==3.11.17"
dependencies = [
  "av==18.1.0; sys_platform == 'win32'",
  "ctranslate2==4.8.2; sys_platform == 'win32'",
  "faster-whisper==1.2.1; sys_platform == 'win32'",
  "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "numpy==2.4.6",
  "pydantic==2.13.5",
  "sentence-transformers==6.1.0",
  "silero-vad==6.2.3",
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "torchcodec==0.17.0",
  "transformers==5.19.0",
]

[tool.uv]
package = false
default-groups = []
