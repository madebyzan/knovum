  "onnxruntime==1.30.0",
  "pydantic==2.13.5",
  "silero-vad==6.2.3",
  "torch==2.14.1",
  "torchaudio==2.11.0",
  "torchcodec==0.17.0",
  "transformers==5.19.0",
  "voxcpm @ git+https://github.com/OpenBMB/VoxCPM.git@f0c787f0937dc1c9a8f4f64d9a332d9c5da2e629",
]

[tool.uv]
package = false
default-groups = []
