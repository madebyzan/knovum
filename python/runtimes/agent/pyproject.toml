[project]
name = "knovum-agent-runtime"
version = "0.1.0"
description = "Isolated dependencies for the Knovum Agent Runtime"
requires-python = "==3.11.17"
dependencies = [
  "deepagents==0.7.22",
  "langgraph==1.2.14",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-openai==1.6.7",
  "langchain-anthropic==1.7.5",
  "langchain-google-genai==4.4.0",
  "langchain-ollama==1.1.0",
  "langchain-deepseek==1.1.1",
  "langchain-groq==1.1.3",
  "pydantic==2.13.5",
  "truststore==0.10.4",
]

[dependency-groups]
quality = ["mypy==2.4.0", "pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
package = false
default-groups = []
