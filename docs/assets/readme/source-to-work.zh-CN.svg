<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656" role="img" aria-labelledby="title desc">
<title id="title">从资料到可追溯的创作结果</title><desc id="desc">Knovum 空间示意：论文和文章支持待审阅的主张，笔记为问题提供上下文；创作步骤生成研究简报，并记录输入、来源版本、动作与执行端。已完成的步骤可绑定新资料再次运行。</desc>
