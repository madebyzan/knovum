<title id="title">From sources to a traceable result</title><desc id="desc">A schematic of a Knovum Space. Notes raise a question; a meeting recording and a saved article support a draft claim. A creation step produces a document with recorded inputs, source revisions, action and executor. Canvas editing, search, transcription and embeddings need no AI connection.</desc>
